[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff"
version = "0.1.0"
description = "Deterministic version control and release gates for prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
promptdiff = "promptdiff.cli:main"

[tool.setuptools.packages.find]
include = ["promptdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
